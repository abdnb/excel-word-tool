name: Build Linux ARM64 Version

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-linux-arm64:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 QEMU（用于 ARM64 模拟）
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    
    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 构建 ARM64 版本
      run: |
        docker buildx build \
          --platform linux/arm64 \
          --load \
          -t excel-word-arm64 \
          -f- . << 'EOF'
        FROM --platform=linux/arm64 python:3.10-slim
        
        RUN apt-get update && apt-get install -y \
            python3-tk \
            && rm -rf /var/lib/apt/lists/*
        
        WORKDIR /app
        COPY requirements.txt .
        COPY gui_app.py .
        COPY build_linux.py .
        COPY icon.ico .
        
        RUN pip install --no-cache-dir -r requirements.txt
        RUN python3 build_linux.py
        RUN chmod +x dist/Excel-Word工具
        EOF
    
    - name: 提取可执行文件
      run: |
        docker create --name temp-container excel-word-arm64
        docker cp temp-container:/app/dist/Excel-Word工具 ./Excel-Word工具-arm64
        docker rm temp-container
    
    - name: 上传 ARM64 可执行文件
      uses: actions/upload-artifact@v4
      with:
        name: Excel-Word工具-Linux-ARM64
        path: Excel-Word工具-arm64
        retention-days: 30
    
    - name: 显示文件信息
      run: |
        ls -lh Excel-Word工具-arm64
        file Excel-Word工具-arm64
